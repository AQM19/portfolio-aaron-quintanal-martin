name: Sync content

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch published content snapshot
        env:
          CONTENT_URL: ${{ secrets.CONTENT_JSON_URL }}
        run: |
          if [ -z "$CONTENT_URL" ]; then
            echo "CONTENT_JSON_URL not configured. Skipping sync."
            exit 0
          fi

          mkdir -p data
          curl -fsSL "$CONTENT_URL" -o data/content.json

      - name: Validate JSON
        run: |
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('data/content.json','utf8')); if(!data || typeof data !== 'object'){ throw new Error('Invalid content payload'); } console.log('content payload valid');"

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.json
          git diff --cached --quiet || git commit -m "chore: sync content"

      - name: Push updates
        run: git push
